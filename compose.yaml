services:
  swiss-procurement-mcp:
    build: .
    image: swiss-procurement-mcp:dev
    ports: ["8000:8000"]
    environment:
      MCP_TRANSPORT: sse
      # Bind all interfaces INSIDE the isolated container so the published port
      # is reachable; the server defaults to 127.0.0.1 otherwise (SEC-016, see
      # __main__.py). This is not the same as exposing the host interface.
      MCP_HOST: "0.0.0.0"
      PORT: "8000"
      LOG_LEVEL: INFO
    # SEC-007: the process needs no writable root, no capabilities and no way to
    # gain privileges. It reads one public HTTP API and writes to stderr.
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # SCALE-006: honoured by `docker compose up` (v2).
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    restart: unless-stopped
