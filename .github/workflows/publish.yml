name: Publish to PyPI

on:
  push:
    tags:
      - "v*"          # Triggered on every tag like v0.2.0, v1.0.0 etc.
  workflow_dispatch:  # Allows manual dispatch (e.g. when no tag can be pushed).
                      # Publishes the version from the selected branch's
                      # pyproject.toml. skip-existing guards against double uploads.

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/swiss-procurement-mcp

    permissions:
      id-token: write   # Required for Trusted Publisher (OIDC)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - name: Install build dependencies
        run: pip install hatch

      - name: Build package
        run: hatch build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No 'with: password:' needed — Trusted Publisher handles auth.
        with:
          # Does not fail if a version already exists on PyPI (PyPI is
          # immutable; a re-upload of the same version would otherwise fail
          # with "400 File already exists").
          skip-existing: true

  publish-mcp:
    name: Publish to MCP Registry
    needs: build-and-publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for MCP Registry Trusted Publishing (OIDC)
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Sync server.json version to the published artifact
        run: |
          # pyproject.toml is the single source of truth: it is what `hatch
          # build` used for the artifact that was just uploaded to PyPI, so it
          # is the only version the registry can possibly find there.
          #
          # The previous fallback read server.json's own literal, which was a
          # fourth hand-maintained copy of the version. It drifted to 0.4.0
          # while pyproject moved on, and the registry then rejected the
          # publish because it went looking for a release that had never
          # existed on PyPI.
          PYPROJECT_VERSION="$(grep -m1 '^version' pyproject.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ -z "$PYPROJECT_VERSION" ]; then
            echo "::error::could not read version from pyproject.toml"
            exit 1
          fi

          # On a tag run the tag must agree with pyproject, or PyPI and the
          # registry would again be told two different things — which is the
          # same failure, just arriving from the other side.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG_VERSION="${GITHUB_REF_NAME#v}"
            if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
              echo "::error::tag $GITHUB_REF_NAME implies version $TAG_VERSION, but pyproject.toml says $PYPROJECT_VERSION. PyPI received $PYPROJECT_VERSION; the registry would look for $TAG_VERSION and fail."
              exit 1
            fi
          fi

          VERSION="$PYPROJECT_VERSION"
          jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' \
            server.json > server.tmp && mv server.tmp server.json
          echo "server.json set to version $VERSION"

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: |
          # The PyPI step above carries `skip-existing: true`; this one had no
          # equivalent, so a second trigger for a version already in the registry
          # turned a completed release into a red build.
          #
          # That is not hypothetical. It has happened three times in this repo
          # (publish runs #1, #3 and #7), always the same way: a
          # `workflow_dispatch` publishes successfully, and the tag push for the
          # same version arrives minutes later and is rejected as a duplicate.
          # Both triggers are declared by this workflow and both are legitimate,
          # so the collision is designed in rather than a mistake by whoever
          # released.
          #
          # A duplicate means the desired end state — this version is in the
          # registry — already holds, so it is success. Every other failure still
          # fails the job: the point of a red publish build is that a real one
          # gets noticed, and it will not be if the usual outcome is also red.
          set -o pipefail
          if ./mcp-publisher publish 2>&1 | tee publish.log; then
            exit 0
          fi
          if grep -qF "cannot publish duplicate version" publish.log; then
            echo "::notice title=Already published::This version is already in the MCP registry; treating the duplicate as success."
            exit 0
          fi
          echo "::error title=Registry publish failed::mcp-publisher failed for a reason other than a duplicate version — see the log above."
          exit 1
