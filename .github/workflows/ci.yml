name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Nightly live tests at 03:23 UTC to catch simap.ch schema drift.
    - cron: "23 3 * * *"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: pip install uv

      # ruff kommt exakt gepinnt aus dem `dev`-Extra in pyproject.toml. Kein
      # zweiter Pin-Schritt hier: Zwei Stellen fuer dieselbe Version driften
      # auseinander, und die CI merkt es nicht, weil sie sich selbst
      # ueberschreibt — lokal laeuft dann ein anderes Gate als hier.
      - name: Install dependencies
        run: uv pip install -e ".[dev]" --system

      - name: Syntax check
        run: python -m py_compile src/swiss_procurement_mcp/server.py src/swiss_procurement_mcp/client.py

      - name: Import test
        run: python -c "from swiss_procurement_mcp.server import mcp; print('Import OK')"
        env:
          PYTHONPATH: src

      - name: Unit tests (respx-mocked)
        run: pytest -m "not live" -v
        env:
          PYTHONPATH: src

      - name: Versions-Sync (pyproject ↔ server.json / README / src)
        run: python scripts/check_version_sync.py

  lint:
    runs-on: ubuntu-latest
    steps:
      # Volle Historie samt Tags, fuer die Release-Drift-Pruefung unten. Ohne
      # `fetch-depth: 0` holt checkout nur den einen Commit und keinen Tag —
      # der Check waere dann gruen, ohne einen Tag gesehen zu haben. Er bricht
      # deshalb bei einem flachen Checkout ab, statt still zu bestehen.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      # ruff kommt aus dem dev-Extra. Dieser Job hatte vorher nur den
      # separaten Pin-Schritt als ruff-Quelle; mit dessen Wegfall stand er
      # ohne Werkzeug da (`ruff: command not found`).
      - name: Install dependencies
        run: pip install -e ".[dev]"

      # Der Pin wirkt nur, wenn `ruff` ihn auch aufruft: liegt frueher im
      # PATH ein anderes ruff, gewinnt jenes, und der Install meldet nichts.
      - name: Ruff-Pin (PATH und Modul gegen pyproject.toml)
        run: python scripts/check_ruff_pin.py

      # `check_version_sync.py` vergleicht die Kopien der Versionsnummer
      # untereinander. Ob die Nummer noch zum Artefakt passt, sieht er nicht:
      # Vom 7.8. bis 27.9.2026 deklarierte `main` weiter die Version des
      # letzten Tags, waehrend sich `src/` seither um +516/-23 Zeilen
      # veraendert hatte.
      - name: Release-Drift (getaggte Version gegen src/ und Laufzeit-Abhaengigkeiten)
        run: python scripts/check_release_drift.py

      # `scripts/` kam zuletzt dazu, weil es ausserhalb BEIDER Gates lag.
      # Dort steht kein Beiwerk: `check_version_sync.py` ist selbst ein
      # CI-Gate, `record_fixtures.py` erzeugt die Fixtures, gegen die die
      # Unit-Tests laufen, und `classify_live_run.py` entscheidet, ob ein
      # Live-Lauf `clear`, `finding` oder `unknown` heisst. Werkzeug, an dem
      # die Aussagekraft des geprueften Codes haengt, gehoert selbst geprueft.
      - run: ruff check src/ tests/ scripts/

      # Scope identisch mit `ruff check` oben. Zwei Gates mit zwei
      # Reichweiten sehen aus wie eins.
      - run: ruff format --check src/ tests/ scripts/

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [test]
    # The GHA cache backend (`type=gha`) writes to the Actions cache and so
    # needs `actions: write`; the top-level `contents: read` would otherwise
    # strip it and make build-push-action fail while initialising the exporter.
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          load: true
          tags: swiss-procurement-mcp:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

      # SEC-007: a Dockerfile that builds but runs as root would still fail the
      # check, so assert the hardening rather than trusting the instructions.
      # The bar is a UID >= 10000, not merely non-zero — the 100-999 system
      # range collides with host accounts under a bind mount.
      - name: Image runs as a non-root user with a high UID
        run: |
          uid=$(docker run --rm swiss-procurement-mcp:ci id -u)
          test "$uid" -ge 10000 || { echo "uid $uid is below the required 10000"; exit 1; }
          echo "runs as uid $uid"

      - name: Default seccomp profile is active
        run: |
          mode=$(docker run --rm swiss-procurement-mcp:ci python -c \
            "print(next(l.split()[1] for l in open('/proc/self/status') if l.startswith('Seccomp:')))")
          test "$mode" = "2" || { echo "seccomp not filtering (mode $mode)"; exit 1; }
          echo "seccomp mode $mode (filtering)"

      - name: Server imports under a read-only root filesystem
        run: |
          docker run --rm --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            swiss-procurement-mcp:ci \
            python -c "import swiss_procurement_mcp.server; print('ok')"

  release-lag:
    # Wie `live` nur nachts oder von Hand: Der Rueckstand ist keine Eigenschaft
    # eines PR, sondern der Zeit seit dem letzten Release.
    #
    # `check_release_drift.py` im Job `lint` verhindert, dass eine Nummer fuer
    # zwei Codestaende steht. Wie lange ausgelieferte Aenderungen danach
    # unveroeffentlicht bleiben, sieht er nicht: nach dem ersten Versionssprung
    # ist er gruen. Vom 7.8. bis 27.9.2026 waren es 51 Tage, und in der
    # publizierten Version war `get_publication_history` fuer losbasierte
    # Beschaffungen die ganze Zeit defekt.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      # Volle Historie samt Tags: Der Bezug ist der neueste von HEAD aus
      # erreichbare Versions-Tag, das Alter der Merge-Zeitpunkt in main.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      # Nur Standardbibliothek, deshalb kein Install. Die Schwelle ist eine
      # Setzung, keine Messung.
      - name: Rueckstand messen
        id: lag
        env:
          RELEASE_LAG_DAYS: "14"
        run: python scripts/check_release_lag.py --report release-lag.md

      - name: Issue oeffnen, aktualisieren oder schliessen
        uses: actions/github-script@v9
        # Ueber `env`, nicht ueber `${{ }}` im Skript — derselbe Grund wie im
        # Job `live`. Der Bericht enthaelt Commit-Betreffe, also fremden Text;
        # er wird aus der Datei gelesen und nie in Code eingesetzt.
        env:
          LAG_STATE: ${{ steps.lag.outputs.state }}
          LAG_REASON: ${{ steps.lag.outputs.reason }}
        with:
          script: |
            const fs = require('fs');
            const state = process.env.LAG_STATE;
            const reason = process.env.LAG_REASON || '';
            const PREFIX = 'Release ueberfaellig';
            const LABEL = 'release';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                        `/actions/runs/${context.runId}`;
            const heute = new Date().toISOString().slice(0, 10);

            const issues = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: LABEL, per_page: 100,
            });
            const open = issues.data.find(
              (i) => !i.pull_request && i.title.startsWith(PREFIX)
            );

            if (state === 'unknown') {
              // Nichts gemessen, also nichts am Issue aendern. Rot wird der
              // Job im naechsten Schritt.
              core.warning(`Release-Rueckstand nicht messbar: ${reason}. Am Issue wurde nichts geaendert.`);
              return;
            }

            if (state === 'finding') {
              const bericht = fs.readFileSync('release-lag.md', 'utf8');
              const body = `${bericht}\n\nZuletzt gemessen am ${heute}: ${run}`;
              if (open) {
                // Den Text ersetzen statt jede Nacht zu kommentieren: Ein
                // Rueckstand von drei Wochen waeren sonst 21 Kommentare.
                await github.rest.issues.update({
                  ...context.repo, issue_number: open.number, body,
                });
              } else {
                try {
                  await github.rest.issues.createLabel({
                    ...context.repo, name: LABEL, color: 'fbca04',
                    description: 'Ausgelieferte Aenderungen warten auf ein Release',
                  });
                } catch (e) {
                  if (e.status !== 422) throw e;  // 422 = existiert bereits
                }
                await github.rest.issues.create({
                  ...context.repo, title: `${PREFIX} (${heute})`, body, labels: [LABEL],
                });
              }
              return;
            }

            // clear: nur hier wird zugemacht, weil nur hier gemessen und
            // kein Rueckstand ueber der Schwelle gefunden wurde.
            if (open) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open.number,
                body: `Kein Rueckstand mehr ueber der Schwelle (${reason}). Lauf: ${run}`,
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: open.number,
                state: 'closed', state_reason: 'completed',
              });
            }

      # Rot nur bei `unknown`. Ein Befund steht im Issue; wuerde er den Job
      # rot faerben, waere der naechtliche Lauf womoeglich wochenlang rot aus
      # einem Grund, der nichts mit dem Code zu tun hat — und rot, an das man
      # sich gewoehnt, zeigt nichts mehr an.
      - name: Nicht messbar ist rot
        if: steps.lag.outputs.state == 'unknown'
        env:
          LAG_REASON: ${{ steps.lag.outputs.reason }}
        run: |
          echo "Release-Rueckstand nicht messbar: $LAG_REASON"
          exit 1

  live:
    # Only on the nightly schedule or manual dispatch — never on PR/push so the
    # mainline build is not held hostage to simap.ch availability.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"

      - run: pip install -e ".[dev]"

      # `continue-on-error`, damit die Einordnung in jedem Fall laeuft. Rot
      # wird der Job weiter unten, aus dem eingeordneten Ergebnis.
      - name: Live-Suite
        id: suite
        continue-on-error: true
        env:
          PYTHONPATH: src
        timeout-minutes: 5
        run: |
          set +e
          pytest tests/ -m live -v --junitxml=live-report.xml 2>&1 | tee live-output.txt
          echo "pytest_exit=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"

      # `if: failure()` kennt rot und nicht rot. Ein Live-Lauf hat drei
      # Antworten, und die dritte zaehlt: Ein gescheitertes `pip install`, ein
      # Timeout oder eine umbenannte Marke sind NICHT dasselbe wie ein
      # gebrochener Vertrag mit der Quelle. Und ein Lauf, in dem jeder Test
      # uebersprungen wurde, sieht unter jedem Exit-Code-Check aus wie Erfolg.
      - name: Ergebnis einordnen
        id: verdict
        run: |
          python scripts/classify_live_run.py live-report.xml \
            --pytest-exit "${{ steps.suite.outputs.pytest_exit }}"
          {
            echo "tail<<PYTEST_TAIL"
            tail -n 40 live-output.txt || true
            echo "PYTEST_TAIL"
          } >> "$GITHUB_OUTPUT"

      - name: Issue oeffnen, aktualisieren oder schliessen
        uses: actions/github-script@v9
        # Ueber `env`, nicht ueber Actions-Expressions im Skript: Die
        # pytest-Ausgabe ist fremder Text, der sonst in einem
        # JavaScript-Template-Literal landet. Ein Backtick darin bricht das
        # Skript oder fuehrt aus, was in einer Assertion-Meldung stand.
        env:
          LIVE_STATE: ${{ steps.verdict.outputs.state }}
          LIVE_REASON: ${{ steps.verdict.outputs.reason }}
          LIVE_TAIL: ${{ steps.verdict.outputs.tail }}
        with:
          script: |
            const state = process.env.LIVE_STATE;
            const reason = process.env.LIVE_REASON || '';
            const tail = process.env.LIVE_TAIL || '(keine Ausgabe)';
            // Stabiles Praefix: Damit ein zweiter roter Lauf den bestehenden
            // Thread verlaengert statt einen zweiten aufzumachen.
            const PREFIX = 'Live-Tests gegen simap.ch rot';
            const LABEL = 'upstream';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}` +
                        `/actions/runs/${context.runId}`;
            const heute = new Date().toISOString().slice(0, 10);

            // `issues.listForRepo` statt der Such-API: Die Suche indexiert
            // verzoegert — ein frisch geoeffnetes Issue findet sie unter
            // Umstaenden nicht, und dann legt der naechste Lauf ein zweites an.
            const issues = await github.rest.issues.listForRepo({
              ...context.repo, state: 'open', labels: LABEL, per_page: 100,
            });
            const open = issues.data.find(
              (i) => !i.pull_request && i.title.startsWith(PREFIX)
            );

            if (state === 'unknown') {
              // Weder oeffnen noch schliessen: Der Lauf hat nichts ueber den
              // Vertrag mit simap.ch festgestellt. Sichtbar ueber den roten Job.
              core.warning(`Live-Suite nicht ausgewertet: ${reason}. Am Issue wurde nichts geaendert.`);
              return;
            }

            if (state === 'finding') {
              const body = [
                'Die geplante Live-Suite gegen `simap.ch` ist rot.',
                '',
                `Lauf: ${run}`,
                `Einordnung: ${reason}`,
                '',
                '**Rot heisst hier nicht zwingend «unser Fehler».** Es heisst: Der Vertrag',
                'mit der Quelle hat sich geaendert, oder die Quelle ist gerade aus. Beides',
                'gehoert gesehen, nur das Erste gehoert gefixt — und genau das Erste sehen',
                'die Unit-Tests nicht, weil ihre Fixtures aus derselben Annahme geschrieben',
                'sind wie der Code.',
                '',
                '<details><summary>Letzte Zeilen der pytest-Ausgabe</summary>',
                '',
                '```',
                tail,
                '```',
                '',
                '</details>',
              ].join('\n');

              if (open) {
                await github.rest.issues.createComment({
                  ...context.repo, issue_number: open.number,
                  body: `Wieder rot am ${heute}.\n\n${body}`,
                });
              } else {
                // Label anlegen, falls das Repo es noch nicht kennt: Sonst
                // scheitert `issues.create` beim allerersten roten Lauf.
                try {
                  await github.rest.issues.createLabel({
                    ...context.repo, name: LABEL, color: 'd93f0b',
                    description: 'Vertrag mit einer externen Quelle betroffen',
                  });
                } catch (e) {
                  if (e.status !== 422) throw e;  // 422 = existiert bereits
                }
                await github.rest.issues.create({
                  ...context.repo, title: `${PREFIX} (${heute})`, body, labels: [LABEL],
                });
              }
              return;
            }

            // clear — nur hier wird zugemacht, weil nur hier wirklich
            // verglichen und nichts gefunden wurde.
            if (open) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: open.number,
                body: `Die Live-Suite ist wieder gruen (${reason}). Lauf: ${run}`,
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: open.number,
                state: 'closed', state_reason: 'completed',
              });
            }

      # Erst hier wird der Job rot. `clear` ist gruen; `finding` und `unknown`
      # sind beide rot, aber nur `finding` hat oben ein Issue erzeugt.
      - name: Ergebnis durchreichen
        if: steps.verdict.outputs.state != 'clear'
        # Ueber `env`, nicht ueber `${{ }}`: Der Grund kann eine Parser-Meldung
        # ueber eine fremde Datei enthalten, und `${{ }}` setzt ihn vor dem Start
        # woertlich in die Shell ein — ein `$(...)` oder ein Anfuehrungszeichen
        # darin liefe mit. Der github-script-Schritt macht es aus demselben Grund
        # schon so.
        env:
          LIVE_STATE: ${{ steps.verdict.outputs.state }}
          LIVE_REASON: ${{ steps.verdict.outputs.reason }}
        run: |
          echo "Live-Suite: $LIVE_STATE"
          echo "$LIVE_REASON"
          exit 1
