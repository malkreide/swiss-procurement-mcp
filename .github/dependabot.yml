# Keeps the MCP SDK and other dependencies (plus the CI actions) current, so a
# breaking `mcp` release arrives as a reviewable PR rather than a silent drift
# (ARCH-012). Grouped to keep PR noise low.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
